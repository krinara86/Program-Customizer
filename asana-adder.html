<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add new Asana to Firestore</title>
  <!-- Include the Firebase libraries -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <style>
    body {
      background-color: #BBC9D2;
      color: #000000;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #repetitionsInput {
      max-width: 80px;
    }

    #searchResults {
      position: absolute;
      background-color: white;
      border: 1px solid #ddd;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 1000;
    }

    #searchResults div {
      padding: 10px;
      cursor: pointer;
    }

    #searchResults div:hover {
      background-color: #f0f0f0;
    }


    h1 {
      margin-bottom: 20px;
      color: #ffffff;
      background-color: #483a3a;
      padding: 10px;
      display: inline-block;
    }

    .logo-title-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      background-color: #483a3a;
      padding: 10px;
    }

    .logo {
      width: 50px;
      /* Adjust the width as needed */
      margin-right: 10px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #cccccc;
      background-color: #ffffff;
      color: #333333;
      box-sizing: border-box;
    }

    button,
    .delete-button {
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      background-color: #c91818;
      color: #ffffff;
      cursor: pointer;
    }

    ::placeholder {
      /* Chrome, Firefox, Opera, Safari 10.1+ */
      color: grey;
      opacity: 1;
      /* Firefox */
    }

    :-ms-input-placeholder {
      /* Internet Explorer 10-11 */
      color: grey;
    }

    ::-ms-input-placeholder {
      /* Microsoft Edge */
      color: grey;
    }

    .asana-div {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid transparent;
      /* Invisible at start */
      transition: border 0.3s ease;
      /* Smooth transition */
      padding: 10px;
      /* Add padding inside the divs */
    }

    .asana-div:not(:empty) {
      border-color: black;
      /* Border becomes visible when div is not empty */
    }

    button,
    .asana-button {
      margin: 20px 0;
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      background-color: #000000;
      color: #ffffff;
      cursor: pointer;
      width: auto;
    }

    button:hover,
    .delete-button:hover {
      background-color: #252829;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 700px;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }

    #displayNameTable {
      width: 100%;
      border-collapse: collapse;
    }

    #displayNameTable th,
    #displayNameTable td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #displayNameTable th {
      background-color: #f2f2f2;
    }

    #displayNameTable .category-header td {
      font-weight: bold;
      background-color: #e9e9e9;
      padding-top: 12px;
      padding-bottom: 12px;
    }
  </style>
</head>

<body>
  <div>
    <label for="name">Search/Add Asana:</label>
    <input type="text" id="name" autocomplete="off">
    <div id="searchResults"></div>
  </div>
  <div>
    <label for="description">Description:</label>
    <textarea id="description" rows="4" cols="50"></textarea>
  </div>
  <div>
    <label for="image">Image:</label>
    <input type="file" id="image" accept="image/*">
    <img id="imagePreview" src="" alt="Asana Image Preview"
      style="max-width: 200px; max-height: 200px; display: none; margin-top: 10px; border-radius: 5px;">
  </div>
  <button id="saveButton">Save</button>
  <button id="deleteButton" class="delete-button" style="display: none;">Delete Asana</button>
  <button id="openDisplayNameEditor">Edit Display Name and Category</button>

  <div id="displayNameModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Display Names and Categories</h2>
      <table id="displayNameTable">
        <thead>
          <tr>
            <th>Asana Name</th>
            <th>Display Name</th>
            <th>Category</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="displayNameTableBody">
        </tbody>
      </table>
      <button id="saveDisplayNames">Save Changes</button>
    </div>
  </div>

  <script>
    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD2Qv-8dC9atWBU_IFWXmxsGSp5T-_FOtM",
      authDomain: "sadhakacustomizer.firebaseapp.com",
      projectId: "sadhakacustomizer",
      storageBucket: "sadhakacustomizer.appspot.com",
      messagingSenderId: "401905258509",
      appId: "1:401905258509:web:cd9661bbe700b04fa00544"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // ───────────────────────────────────────────────────────────────────────
    // Asana deletion helpers.
    // NOTE: These are kept in sync with asana-delete.js, which is the canonical
    // copy covered by asana-delete.test.js. They are inlined here so the page
    // works regardless of how it is served (some deploys don't serve the
    // sibling .js file). If you change one, change both.
    // ───────────────────────────────────────────────────────────────────────

    // Fields on a sadhaka document that hold arrays of asana references
    // (mirrors the asana-type sections in config.js / CATEGORIES).
    const ASANA_ARRAY_FIELDS = [
      'jointsAndGlandsDiv',
      'cardioDiv',
      'nonCardioDiv',
      'relaxationDiv',
      'meditativeDiv',
      'breathingDiv',
      'pranayamaDiv',
      'meditationDiv',
    ];

    // Return the names of sadhakas that reference the given asana name.
    function findSadhakasUsingAsana(asanaName, sadhakaDocs, fields = ASANA_ARRAY_FIELDS) {
      if (!asanaName || !Array.isArray(sadhakaDocs)) return [];

      const users = [];
      for (const doc of sadhakaDocs) {
        const data = doc && typeof doc.data === 'function' ? doc.data() : doc;
        if (!data) continue;

        const sadhakaName = data.name || (doc && doc.id) || '(unnamed)';
        const usesAsana = fields.some(field => {
          const arr = data[field];
          return Array.isArray(arr) && arr.some(entry => entry && entry.asanaName === asanaName);
        });

        if (usesAsana) users.push(sadhakaName);
      }
      return users;
    }

    // Build the confirmation message shown before deleting an asana.
    function buildDeleteConfirmationMessage(asanaName, users) {
      if (users && users.length > 0) {
        const list = users.join(', ');
        return (
          `⚠️ "${asanaName}" is used by ${users.length} Sadhaka(s): ${list}.\n\n` +
          `Deleting it will leave broken references in their programs. ` +
          `Those Sadhakas will NOT be modified.\n\nDelete anyway?`
        );
      }
      return `Are you sure you want to delete "${asanaName}"? This cannot be undone.`;
    }

    const nameInput = document.getElementById("name");
    const searchResults = document.getElementById("searchResults");
    const descriptionInput = document.getElementById("description");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");
    const saveButton = document.getElementById("saveButton");
    const deleteButton = document.getElementById("deleteButton");
    const modal = document.getElementById("displayNameModal");
    const openModalBtn = document.getElementById("openDisplayNameEditor");
    const closeModalSpan = document.getElementsByClassName("close")[0];
    const saveDisplayNamesBtn = document.getElementById("saveDisplayNames");
    const displayNameTableBody = document.getElementById("displayNameTableBody");

    let selectedAsana = null;

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    nameInput.addEventListener("input", debounce(async (e) => {
      const searchTerm = e.target.value.trim().toLowerCase();
      if (searchTerm.length < 2) {
        searchResults.style.display = "none";
        return;
      }

      try {
        const asanasRef = db.collection("asanas");
        const snapshot = await asanasRef.get();
        const matchingAsanas = snapshot.docs.filter(doc => {
          const asanaData = doc.data();
          return asanaData.name.toLowerCase().includes(searchTerm) ||
            (asanaData.displayName && asanaData.displayName.toLowerCase().includes(searchTerm));
        });

        searchResults.innerHTML = "";
        matchingAsanas.forEach(doc => {
          const asanaData = doc.data();
          const div = document.createElement("div");
          div.textContent = asanaData.displayName || asanaData.name;
          div.addEventListener("click", () => selectAsana(doc));
          searchResults.appendChild(div);
        });

        searchResults.style.display = matchingAsanas.length === 0 ? "none" : "block";
      } catch (error) {
        console.error("Error searching asanas:", error);
      }
    }, 300));

    function selectAsana(doc) {
      selectedAsana = doc;
      const asanaData = doc.data();
      nameInput.value = asanaData.displayName || asanaData.name;
      descriptionInput.value = asanaData.description || "";

      if (asanaData.imageUrl) {
        imagePreview.src = asanaData.imageUrl;
        imagePreview.style.display = "block";
      } else {
        imagePreview.src = "";
        imagePreview.style.display = "none";
      }

      // An existing asana is now selected, so deletion is possible.
      deleteButton.style.display = "inline-block";

      searchResults.style.display = "none";
    }

    saveButton.addEventListener("click", async () => {
      const name = nameInput.value.trim();
      const normalizedName = name.charAt(0).toUpperCase() + name.slice(1); // Keep casing as entered after first char
      const description = descriptionInput.value.trim();
      const imageFile = imageInput.files[0];

      if (!normalizedName) {
        alert("Please enter an asana name.");
        return;
      }

      try {
        if (selectedAsana) {
          // --- UPDATE EXISTING ASANA ---
          const updateData = {
            name: normalizedName,
            nameLower: normalizedName.toLowerCase(),
            description: description,
            displayName: normalizedName // Always update display name on edit
          };

          if (imageFile) {
            const imageRef = storage.ref().child('images/' + Date.now() + '_' + imageFile.name);
            const snapshot = await imageRef.put(imageFile);
            updateData.imageUrl = await snapshot.ref.getDownloadURL();
          }
          // If no new image is selected, the existing imageUrl is preserved by not including it in updateData.

          await selectedAsana.ref.update(updateData);
          alert("Asana updated successfully!");
        } else {
          // --- ADD NEW ASANA ---
          const addData = {
            name: normalizedName,
            nameLower: normalizedName.toLowerCase(),
            description: description,
            displayName: normalizedName // Set initial display name
          };

          if (imageFile) {
            const imageRef = storage.ref().child('images/' + Date.now() + '_' + imageFile.name);
            const snapshot = await imageRef.put(imageFile);
            addData.imageUrl = await snapshot.ref.getDownloadURL();
          }

          await db.collection("asanas").add(addData);
          alert("New asana added successfully!");
        }

        // Reset form
        nameInput.value = "";
        descriptionInput.value = "";
        imageInput.value = "";
        imagePreview.style.display = "none";
        imagePreview.src = "";
        selectedAsana = null;
        deleteButton.style.display = "none";

      } catch (error) {
        console.error("Error saving asana:", error);
        alert("An error occurred while saving the asana. Please try again.");
      }
    });

    function resetAsanaForm() {
      nameInput.value = "";
      descriptionInput.value = "";
      imageInput.value = "";
      imagePreview.style.display = "none";
      imagePreview.src = "";
      selectedAsana = null;
      deleteButton.style.display = "none";
    }

    // Shared delete routine: scans sadhakas, warns if the asana is in use, and
    // deletes only the asana document (sadhaka records are left untouched).
    // Returns true if the asana was deleted, false if the user cancelled.
    async function deleteAsanaWithWarning(docRef, asanaName) {
      const sadhakasSnapshot = await db.collection("sadhakas").get();
      const users = findSadhakasUsingAsana(asanaName, sadhakasSnapshot.docs);
      const message = buildDeleteConfirmationMessage(asanaName, users);

      if (!confirm(message)) {
        return false;
      }

      await docRef.delete();
      return true;
    }

    deleteButton.addEventListener("click", async () => {
      if (!selectedAsana) {
        alert("Please select an existing asana to delete.");
        return;
      }

      const asanaName = selectedAsana.data().name;

      try {
        const deleted = await deleteAsanaWithWarning(selectedAsana.ref, asanaName);
        if (!deleted) return;

        alert(`Asana "${asanaName}" deleted successfully.`);
        resetAsanaForm();
      } catch (error) {
        console.error("Error deleting asana:", error);
        alert("An error occurred while deleting the asana: " + (error && error.message ? error.message : error));
      }
    });

    document.addEventListener("click", (e) => {
      if (e.target !== nameInput && e.target !== searchResults) {
        searchResults.style.display = "none";
      }
    });

    openModalBtn.onclick = async function () {
      modal.style.display = "block";
      await populateDisplayNameTable();
    }

    closeModalSpan.onclick = function () {
      modal.style.display = "none";
    }

    window.onclick = function (event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }

    async function populateDisplayNameTable() {
      const asanasRef = db.collection("asanas");
      const snapshot = await asanasRef.get();
      const categorizedAsanas = {};

      // Group asanas by category
      snapshot.forEach(doc => {
        const asanaData = doc.data();
        const category = asanaData.category || "Uncategorized";
        if (!categorizedAsanas[category]) {
          categorizedAsanas[category] = [];
        }
        // Sort by name within category
        categorizedAsanas[category].push({ id: doc.id, ...asanaData });
        categorizedAsanas[category].sort((a, b) => a.name.localeCompare(b.name));
      });

      displayNameTableBody.innerHTML = "";
      // Sort categories alphabetically
      const sortedCategories = Object.keys(categorizedAsanas).sort();

      sortedCategories.forEach(category => {
        // Add category header row
        const headerRow = displayNameTableBody.insertRow();
        headerRow.className = 'category-header';
        const headerCell = headerRow.insertCell(0);
        headerCell.colSpan = 4;
        headerCell.textContent = category;

        // Add asana rows for this category
        categorizedAsanas[category].forEach(asana => {
          const row = displayNameTableBody.insertRow();
          const cell1 = row.insertCell(0);
          const cell2 = row.insertCell(1);
          const cell3 = row.insertCell(2);
          const cell4 = row.insertCell(3);

          cell1.textContent = asana.name;

          const displayNameInput = document.createElement("input");
          displayNameInput.type = "text";
          displayNameInput.value = asana.displayName || "";
          displayNameInput.dataset.docId = asana.id;
          cell2.appendChild(displayNameInput);

          const categorySelect = document.createElement("select");
          categorySelect.dataset.docId = asana.id;
          const categories = ["Prayer", "Relaxation", "Joints and Glands", "Meditative Asana", "Breathing", "Pranayana", "Meditation", "Physical Asana"];

          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "Select Category";
          categorySelect.appendChild(placeholder);

          categories.forEach(cat => {
            const option = document.createElement("option");
            option.value = cat;
            option.textContent = cat;
            categorySelect.appendChild(option);
          });
          categorySelect.value = asana.category || "";
          cell3.appendChild(categorySelect);

          const rowDeleteButton = document.createElement("button");
          rowDeleteButton.textContent = "Delete";
          rowDeleteButton.className = "delete-button";
          rowDeleteButton.style.margin = "0";
          rowDeleteButton.style.padding = "5px 12px";
          rowDeleteButton.onclick = async () => {
            try {
              const docRef = db.collection("asanas").doc(asana.id);
              const deleted = await deleteAsanaWithWarning(docRef, asana.name);
              if (!deleted) return;

              row.remove();

              // If this asana is also loaded in the main form, clear it.
              if (selectedAsana && selectedAsana.id === asana.id) {
                resetAsanaForm();
              }
            } catch (error) {
              console.error("Error deleting asana:", error);
              alert("An error occurred while deleting the asana: " + (error && error.message ? error.message : error));
            }
          };
          cell4.appendChild(rowDeleteButton);
        });
      });
    }


    saveDisplayNamesBtn.onclick = async function () {
      const allRows = displayNameTableBody.querySelectorAll("tr:not(.category-header)");
      const batch = db.batch();

      allRows.forEach(row => {
        const displayNameInput = row.querySelector("input");
        const categorySelect = row.querySelector("select");
        const docId = displayNameInput.dataset.docId;

        if (docId) {
          const docRef = db.collection("asanas").doc(docId);
          const updateData = {};
          const newDisplayName = displayNameInput.value.trim();
          const newCategory = categorySelect.value;

          if (newDisplayName) {
            updateData.displayName = newDisplayName;
          } else {
            updateData.displayName = firebase.firestore.FieldValue.delete();
          }

          if (newCategory) {
            updateData.category = newCategory;
          } else {
            updateData.category = firebase.firestore.FieldValue.delete();
          }
          batch.update(docRef, updateData);
        }
      });

      try {
        await batch.commit();
        alert("Display names and categories saved successfully!");
        modal.style.display = "none";
      } catch (error) {
        console.error("Error saving display names and categories:", error);
        alert("An error occurred while saving. Please try again.");
      }
    }
  </script>
</body>

</html>
